volumes:
  certs_data: {}
  prometheus_data: {}
  grafana_data: {}
  mongo_data: {}
  redis_data: {}

services:
  server:
    container_name: wordgrid-server
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 512M
        reservations:
          memory: 256M
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "8210:8210"
      - "8211:8211"
    volumes:
      - certs_data:/usr/src/app/certs
      - certs_data:/usr/src/app/server/certs
    environment:
      - API_PORT=${API_PORT:-8210}
      - MATCHMAKING_PORT=${MATCHMAKING_PORT:-8211}
      - MONGODB_URI=${MONGODB_URI:-mongodb://wordgrid-mongo:27017/wordgrid}
      - REDIS_HOST=${REDIS_HOST:-wordgrid-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-super-secret-key}
      - NODE_ENV=${NODE_ENV:-production}
      - ENABLE_TLS=${ENABLE_TLS:-true}
      - CERT_DIR=${CERT_DIR:-/usr/src/app/certs}
      - CERT_PATH=${CERT_PATH:-/usr/src/app/certs/fullchain.pem}
      - KEY_PATH=${KEY_PATH:-/usr/src/app/certs/privkey.pem}
      - ACCOUNT_KEY_PATH=${ACCOUNT_KEY_PATH:-/usr/src/app/certs/account.pem}
      - NETLIFY_AUTH_TOKEN=${NETLIFY_AUTH_TOKEN}
      - NETLIFY_ZONE_NAME=${NETLIFY_ZONE_NAME:-proplayer919.dev}
      - DOMAIN_NAME=${DOMAIN_NAME:-wordgrid-api.proplayer919.dev}
      - ACME_EMAIL=${ACME_EMAIL:-admin@proplayer919.dev}
    depends_on:
      - redis
      - mongodb

  redis:
    image: redis:7-alpine
    container_name: wordgrid-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:7.0
    container_name: wordgrid-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  prometheus:
    image: prom/prometheus:latest
    container_name: wordgrid-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "1256:1256"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.listen-address=:1256'
    depends_on:
      - server

  grafana:
    image: grafana/grafana:latest
    container_name: wordgrid-grafana
    restart: unless-stopped
    ports:
      - "4328:4328"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=4328
      - GF_SERVER_DOMAIN=192.168.1.199
      - GF_SERVER_ROOT_URL=http://192.168.1.199:4328/
