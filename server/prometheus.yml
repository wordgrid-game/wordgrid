global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'wordgrid-server'
    metrics_path: '/health/metrics'
    static_configs:
      - targets: ['https://wordgrid-server:8210']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['http://localhost:1256']
